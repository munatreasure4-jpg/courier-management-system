version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courier-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=courier_system
      - DB_USERNAME=courier_user
      - DB_PASSWORD=courier_password
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - courier_network

  db:
    image: mysql:8.0
    container_name: courier-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: courier_system
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_PASSWORD: courier_password
      MYSQL_USER: courier_user
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - courier_network

  nginx:
    image: nginx:alpine
    container_name: courier-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - courier_network

  redis:
    image: redis:7-alpine
    container_name: courier-redis
    restart: unless-stopped
    networks:
      - courier_network

volumes:
  dbdata:
    driver: local

networks:
  courier_network:
    driver: bridge
